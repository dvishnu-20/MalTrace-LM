[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maltrace"
version = "0.1.0"
description = "Defensive software system converting Windows execution traces to behavior descriptions, malware family predictions, and ATT&CK mappings"
readme = "README.md"
authors = [
    { name = "MalTrace-LM Team" }
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "joblib>=1.2.0",
    "orjson>=3.8.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "streamlit>=1.22.0"
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "langchain>=0.1.0",
    "transformers>=4.30.0"
]

[project.scripts]
maltrace = "maltrace.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "C:/Users/duddu/AppData/Local/Programs/Python/Python310/Lib/site-packages"]

